<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>턴제형 미니게임</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      text-align: center;
      background-color: #121212;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* PC 크기 고정 컨테이너 */
    #game-container {
      width: 100%;
      max-width: 1150px;
      padding: 10px;
      margin: 0 auto;
    }

    /* ================= 1. 타이틀 화면 ================= */
    #title-screen {
      width: 100%;
      min-height: 550px;
      margin: 0 auto;
      border: 3px solid #fff;
      background-color: #1e1e1e;
      position: relative;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 30px 20px 30px;
    }

    .title-a {
      width: 100%;
      padding: 25px 15px;
      border: 3px solid #fff;
      background: #111;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: bold;
      color: #4facfe;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(79, 172, 254, 0.4);
    }

    .title-b {
      width: 100%;
      padding: 20px;
      border: 2px dashed #777;
      background: rgba(0, 0, 0, 0.5);
      font-size: clamp(16px, 2.5vw, 22px);
      color: #ffff00;
      border-radius: 10px;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .title-c {
      align-self: flex-end;
      padding: 8px 16px;
      border: 1px solid #555;
      background: #000;
      font-size: 13px;
      color: #aaa;
      border-radius: 6px;
    }

    /* ================= 2. 닉네임 입력 화면 ================= */
    #name-screen {
      width: 100%;
      min-height: 550px;
      margin: 0 auto;
      border: 3px solid #fff;
      background-color: #1e1e1e;
      position: relative;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 30px;
      gap: 30px;
    }

    .name-aa {
      width: 100%;
      padding: 20px;
      border: 2px solid #fff;
      background: #111;
      font-size: clamp(20px, 3vw, 26px);
      font-weight: bold;
      color: #fff;
      border-radius: 10px;
    }

    .name-input-group {
      width: 100%;
      max-width: 600px;
      display: flex;
      gap: 15px;
    }

    .name-bb {
      flex: 1;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      font-family: inherit;
      background: #000;
      color: #00ff88;
      border: 2px solid #777;
      border-radius: 8px;
      text-align: center;
      outline: none;
    }

    .name-bb:focus {
      border-color: #00ff88;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }

    .name-cc {
      padding: 0 25px;
      font-size: 16px;
      font-weight: bold;
      font-family: inherit;
      background: #333;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 8px;
      cursor: pointer;
    }

    .name-cc:active {
      background: #fff;
      color: #000;
    }

    /* ================= 3. 필드 화면 ================= */
    #field-screen {
      width: 100%;
      height: 700px;
      margin: 0 auto;
      border: 3px solid #fff;
      background-color: #1e1e1e;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      display: none;
    }

    .enemy-node {
      position: absolute;
      width: 18%;
      max-width: 130px;
      min-width: 75px;
      height: 80px;
      border: 2px solid #ff4444;
      background-color: #2a1111;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
      box-shadow: 0 0 8px rgba(255, 68, 68, 0.5);
    }
    .enemy-node .icon { font-size: 22px; margin-bottom: 2px; }

    #player-container {
      position: absolute;
      width: 80px;
      height: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      transform: translateX(-20px);
      transition: left 0.05s linear, top 0.05s linear;
      pointer-events: none;
    }

    #player-nametag {
      font-size: 12px;
      font-weight: bold;
      color: #00ff88;
      text-shadow: 1px 1px 2px #000, -1px -1px 2px #000, 1px -1px 2px #000, -1px 1px 2px #000;
      white-space: nowrap;
      margin-bottom: 3px;
    }

    #player {
      width: 44px;
      height: 44px;
      background-color: #4facfe;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px #4facfe;
    }

    #field-ui {
      position: absolute;
      bottom: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #555;
      border-radius: 10px;
      padding: 15px;
    }

    #dpad {
      width: 140px;
      height: 140px;
      position: relative;
      flex-shrink: 0;
    }
    .pad-btn {
      position: absolute;
      width: 44px;
      height: 44px;
      background: #333;
      color: #fff;
      border: 2px solid #777;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pad-btn:active { background: #666; }
    #btn-w { top: 0; left: 48px; }
    #btn-a { top: 48px; left: 0; }
    #btn-s { top: 96px; left: 48px; }
    #btn-d { top: 48px; left: 96px; }

    #info-panel {
      flex: 1;
      max-width: 450px;
      margin-left: 20px;
      background: #111;
      border: 2px solid #555;
      border-radius: 8px;
      padding: 12px 20px;
      text-align: left;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
    }
    .info-row { display: flex; justify-content: space-between; align-items: center; }
    .exp-bg {
      width: 100%;
      height: 12px;
      background: #333;
      border: 1px solid #777;
      margin-top: 4px;
      border-radius: 6px;
      overflow: hidden;
    }
    #exp-fill {
      height: 100%;
      width: 0%;
      background: #00ff88;
      transition: width 0.3s ease;
    }

    /* ================= 4. 전투 화면 ================= */
    #battle-screen {
      display: none;
      width: 100%;
    }

    #game-board {
      width: 100%;
      height: 480px;
      margin: 0 auto;
      border: 3px solid #fff;
      background-color: #000;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    #game-board.crit-glow {
      border-color: #ffea00 !important;
      box-shadow: 0 0 30px #ffea00, inset 0 0 20px #ffea00 !important;
      animation: flash-border 0.5s ease-out;
    }
    @keyframes flash-border {
      0% { background-color: #332b00; }
      100% { background-color: #000; }
    }

    .shake { animation: shake-anim 0.35s ease-in-out; }
    @keyframes shake-anim {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-8px, 5px); }
      40% { transform: translate(8px, -5px); }
      60% { transform: translate(-5px, 3px); }
      80% { transform: translate(5px, -3px); }
      100% { transform: translate(0, 0); }
    }

    .status-bar {
      position: absolute;
      top: 15px;
      font-weight: bold;
      font-size: clamp(12px, 2vw, 16px);
      text-align: left;
    }
    #hero-status { left: 15px; color: #4facfe; }
    #blob-status { right: 15px; text-align: right; color: #ff0844; }

    .hp-bg {
      width: clamp(100px, 18vw, 200px);
      height: 14px;
      background: #444;
      border: 1px solid #fff;
      margin-top: 5px;
      border-radius: 4px;
      overflow: hidden;
    }
    .hp-fill { height: 100%; width: 100%; transition: width 0.3s ease; }
    #hero-hp-fill { background: #4facfe; }
    #blob-hp-fill { background: #ff0844; }

    .character {
      position: absolute;
      top: 180px;
      font-size: 90px;
    }
    #hero { left: 10%; }
    #blob { right: 10%; }

    #touch-box {
      position: absolute;
      top: 190px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 100px;
      background-color: #1a1a1a;
      border: 3px solid #555;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.8);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #touch-box .box-title { font-size: 11px; color: #aaa; margin-bottom: 2px; }
    #touch-box .box-count { font-size: 40px; font-weight: bold; color: #fff; }

    #touch-box.tier-yellow { border-color: #ffea00 !important; box-shadow: 0 0 15px #ffea00; }
    #touch-box.tier-orange { border-color: #ff8800 !important; box-shadow: 0 0 18px #ff8800; }
    #touch-box.tier-red { border-color: #ff2222 !important; box-shadow: 0 0 20px #ff2222; }
    #touch-box.tier-white { border-color: #ffffff !important; box-shadow: 0 0 25px #ffffff; }

    .slash-effect {
      position: absolute;
      top: 120px;
      right: 10%;
      width: 120px;
      height: 120px;
      pointer-events: none;
      display: none;
    }
    .slash-line {
      position: absolute;
      width: 140%;
      height: 8px;
      background: linear-gradient(90deg, transparent, #fff, #ffea00, #fff, transparent);
      top: 50%;
      left: -20%;
      transform: rotate(-45deg) scaleX(0);
      box-shadow: 0 0 10px #ffea00, 0 0 20px #fff;
    }
    .slash-active .slash-line { animation: slash-anim 0.25s ease-out forwards; }
    @keyframes slash-anim {
      0% { transform: rotate(-45deg) scaleX(0); opacity: 1; }
      50% { transform: rotate(-45deg) scaleX(1.2); opacity: 1; }
      100% { transform: rotate(-45deg) scaleX(1.5); opacity: 0; }
    }

    .floating-damage {
      position: absolute;
      font-size: 32px;
      font-weight: 900;
      color: #ff3333;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      pointer-events: none;
      animation: float-up 0.8s ease-out forwards;
      z-index: 10;
    }
    .floating-damage.crit { color: #ffea00 !important; font-size: 42px !important; }
    @keyframes float-up {
      0% { opacity: 0; transform: translateY(0) scale(0.5); }
      30% { opacity: 1; transform: translateY(-20px) scale(1.3); }
      100% { opacity: 0; transform: translateY(-50px) scale(1); }
    }

    #msg-box {
      height: 50px;
      font-weight: bold;
      color: #ffff00;
      margin: 15px 0;
      font-size: clamp(13px, 2vw, 17px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
    }

    #ui-container {
      width: 100%;
      display: flex;
      gap: 10px;
      justify-content: space-between;
    }
    .btn {
      flex: 1;
      padding: 22px 0;
      font-size: 17px;
      font-weight: bold;
      font-family: inherit;
      border: 2px solid #fff;
      background-color: #000;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:active:not(:disabled) { background-color: #fff; color: #000; }
    .btn:disabled { border-color: #555; color: #555; cursor: not-allowed; }
    #btn-run { border-color: #ff8800; color: #ff8800; }
    #btn-run:active:not(:disabled) { background-color: #ff8800; color: #000; }
  </style>
</head>
<body>

  <div id="game-container">

    <!-- ================= 1. 타이틀 화면 ================= -->
    <div id="title-screen" onclick="goToNameScreen()">
      <div class="title-a">턴제형 미니게임</div>
      <div class="title-b">아무곳이나 클릭해 게임을 시작하세요</div>
      <div class="title-c">제작자: 제미나이, 시온</div>
    </div>

    <!-- ================= 2. 닉네임 입력 화면 ================= -->
    <div id="name-screen">
      <div class="name-aa">닉네임을 입력해 주세요</div>
      <div class="name-input-group">
        <input type="text" id="nickname-input" class="name-bb" value="" placeholder="닉네임 입력" maxlength="8" onclick="event.stopPropagation()">
        <button class="name-cc" onclick="startGameWithNickname(event)">ENTER</button>
      </div>
    </div>

    <!-- ================= 3. 필드 화면 ================= -->
    <div id="field-screen">
      <div class="enemy-node" style="top: 30px; left: 5%;">
        <span class="icon">🟢</span>
        쉬움 (Lv.5)
      </div>
      <div class="enemy-node" style="top: 30px; left: 29%;">
        <span class="icon">🟡</span>
        보통 (Lv.15)
      </div>
      <div class="enemy-node" style="top: 30px; left: 53%;">
        <span class="icon">🟠</span>
        어려움 (Lv.30)
      </div>
      <div class="enemy-node" style="top: 30px; left: 77%;">
        <span class="icon">🔴</span>
        도전 (Lv.40)
      </div>

      <div id="player-container">
        <div id="player-nametag">- (Lv.1)</div>
        <div id="player"></div>
      </div>

      <div id="field-ui">
        <div id="dpad">
          <button id="btn-w" class="pad-btn">W</button>
          <button id="btn-a" class="pad-btn">A</button>
          <button id="btn-s" class="pad-btn">S</button>
          <button id="btn-d" class="pad-btn">D</button>
        </div>

        <div id="info-panel">
          <div class="info-row">
            <span><b>이름:</b> <span id="info-name">-</span></span>
            <span><b>Lv.</b> <span id="info-level">1</span></span>
          </div>
          <div class="info-row">
            <span><b>체력:</b> <span id="info-hp">100</span>/<span id="info-max-hp">100</span></span>
          </div>
          <div class="info-row">
            <span><b>터치당 뎀:</b> <span id="info-dmg">0.20</span></span>
          </div>
          <div>
            <b>경험치:</b> <span id="info-exp">0</span> / <span id="info-max-exp">100</span>
            <div class="exp-bg"><div id="exp-fill"></div></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= 4. 전투 화면 ================= -->
    <div id="battle-screen">
      <div id="game-board">
        <div id="hero-status" class="status-bar">
          <span id="battle-hero-name">-</span> (Lv.<span id="battle-hero-lv">1</span>)<br>
          <div class="hp-bg"><div id="hero-hp-fill" class="hp-fill"></div></div>
          HP: <span id="hero-hp">100.0</span>/<span id="hero-max-hp">100</span>
        </div>
        
        <div id="blob-status" class="status-bar">
          <span id="blob-name">BLOB</span><br>
          <div class="hp-bg"><div id="blob-hp-fill" class="hp-fill"></div></div>
          HP: <span id="blob-hp">250.0</span>/<span id="blob-max-hp">250</span>
        </div>

        <div id="hero" class="character">⚔️</div>
        
        <div id="touch-box">
          <div class="box-title">TAP COUNT</div>
          <div id="touch-count-text" class="box-count">0</div>
        </div>

        <div id="blob" class="character">👾</div>

        <div id="slash-effect" class="slash-effect">
          <div class="slash-line"></div>
        </div>
      </div>

      <div id="msg-box">당신의 턴입니다! [1]~[4] 키 또는 버튼을 누르세요.</div>

      <div id="ui-container">
        <button id="btn-attack" class="btn" onclick="handleAttack(event)">⚔️ ATTACK<br>[1] 공격</button>
        <button id="btn-counter" class="btn" onclick="handleCounter(event)">⚡ COUNTER<br>[2] 반격</button>
        <button id="btn-dodge" class="btn" onclick="handleDodge(event)">💨 DODGE<br>[3] 회피</button>
        <button id="btn-run" class="btn" onclick="handleRun(event)">🏃 RUN<br>[4] 후퇴</button>
      </div>
    </div>
  </div>

  <script>
    // ================= [플레이어 데이터 & 닉네임] =================
    let playerName = "";
    let playerLv = 1;
    let playerExp = 0;
    let playerMaxExp = 100;
    let playerMaxHp = 100;
    let heroHp = 100.0;
    let touchDmgMult = 0.20;

    function goToNameScreen() {
      document.getElementById("title-screen").style.display = "none";
      document.getElementById("name-screen").style.display = "flex";
      setTimeout(() => document.getElementById("nickname-input").focus(), 100);
    }

    function startGameWithNickname(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      
      const inputVal = document.getElementById("nickname-input").value.trim();
      
      if (inputVal === "") {
        alert("닉네임을 입력해 주세요!");
        document.getElementById("nickname-input").focus();
        return;
      }
      
      playerName = inputVal;
      
      document.getElementById("info-name").innerText = playerName;
      document.getElementById("battle-hero-name").innerText = playerName;

      document.getElementById("name-screen").style.display = "none";
      document.getElementById("field-screen").style.display = "block";
      
      isFieldMode = true;
      updateInfoUI();
      repositionEnemies();
    }

    document.getElementById("nickname-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        startGameWithNickname(e);
      }
    });

    // ================= [필드 & 이동 시스템] =================
    let playerX = 0;
    let playerY = 0;
    const moveSpeed = 6;

    let enemiesData = [
      { id: 'easy', name: '쉬움 (Lv.5)', level: 5, hp: 120, minDmg: 3, maxDmg: 8, exp: 50, x: 0, y: 30, w: 100, h: 80 },
      { id: 'normal', name: '보통 (Lv.15)', level: 15, hp: 250, minDmg: 5, maxDmg: 15, exp: 120, x: 0, y: 30, w: 100, h: 80 },
      { id: 'hard', name: '어려움 (Lv.30)', level: 30, hp: 500, minDmg: 12, maxDmg: 25, exp: 300, x: 0, y: 30, w: 100, h: 80 },
      { id: 'boss', name: '도전 (Lv.40)', level: 40, hp: 1000, minDmg: 20, maxDmg: 40, exp: 700, x: 0, y: 30, w: 100, h: 80 }
    ];

    function repositionEnemies() {
      const field = document.getElementById("field-screen");
      const fw = field.clientWidth;
      const nodes = document.querySelectorAll(".enemy-node");
      
      enemiesData[0].x = fw * 0.05;
      enemiesData[1].x = fw * 0.29;
      enemiesData[2].x = fw * 0.53;
      enemiesData[3].x = fw * 0.77;

      nodes.forEach((node, idx) => {
        enemiesData[idx].w = node.clientWidth;
        enemiesData[idx].h = node.clientHeight;
      });

      playerX = fw / 2 - 20;
      playerY = field.clientHeight - 220;
    }

    window.addEventListener("resize", () => {
      if (isFieldMode) repositionEnemies();
    });

    let currentEnemy = null;
    let isFieldMode = false;

    const keys = { w: false, a: false, s: false, d: false };

    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (isFieldMode) {
        if (k === 'w' || k === 'ㅈ') keys.w = true;
        if (k === 'a' || k === 'ㅁ') keys.a = true;
        if (k === 's' || k === 'ㄴ') keys.s = true;
        if (k === 'd' || k === 'ㅇ') keys.d = true;
      } else if (document.getElementById("battle-screen").style.display === "block") {
        // 전투 중일 때 처리
        if (isAttackingMode || isDodgeMode) {
          // 연타 모드 진행 중이면 아무 키나 누르더라도 연타로 인식!
          registerInput();
          return;
        }

        if (isCooltime) return;

        // 턴 선택 메뉴 단축키
        if (e.key === "1") handleAttack(e);
        else if (e.key === "2") handleCounter(e);
        else if (e.key === "3" && !dodgeDisabledTurn) handleDodge(e);
        else if (e.key === "4") handleRun(e);
      }
    });

    window.addEventListener("keyup", (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'ㅈ') keys.w = false;
      if (k === 'a' || k === 'ㅁ') keys.a = false;
      if (k === 's' || k === 'ㄴ') keys.s = false;
      if (k === 'd' || k === 'ㅇ') keys.d = false;
    });

    function bindPadBtn(id, key) {
      const btn = document.getElementById(id);
      btn.addEventListener("pointerdown", (e) => { e.stopPropagation(); keys[key] = true; });
      btn.addEventListener("pointerup", (e) => { e.stopPropagation(); keys[key] = false; });
      btn.addEventListener("pointerleave", (e) => { e.stopPropagation(); keys[key] = false; });
    }
    bindPadBtn("btn-w", "w");
    bindPadBtn("btn-a", "a");
    bindPadBtn("btn-s", "s");
    bindPadBtn("btn-d", "d");

    function fieldLoop() {
      if (isFieldMode) {
        const field = document.getElementById("field-screen");
        const maxW = field.clientWidth - 40;
        const maxH = field.clientHeight - 200;

        if (keys.w) playerY = Math.max(10, playerY - moveSpeed);
        if (keys.s) playerY = Math.min(maxH, playerY + moveSpeed);
        if (keys.a) playerX = Math.max(10, playerX - moveSpeed);
        if (keys.d) playerX = Math.min(maxW, playerX + moveSpeed);

        const playerContainer = document.getElementById("player-container");
        playerContainer.style.left = playerX + "px";
        playerContainer.style.top = playerY + "px";

        checkEnemyCollision();
      }
      requestAnimationFrame(fieldLoop);
    }
    requestAnimationFrame(fieldLoop);

    function checkEnemyCollision() {
      const pRect = { x: playerX, y: playerY, w: 40, h: 40 };
      for (let enemy of enemiesData) {
        if (
          pRect.x < enemy.x + enemy.w &&
          pRect.x + pRect.w > enemy.x &&
          pRect.y < enemy.y + enemy.h &&
          pRect.y + pRect.h > enemy.y
        ) {
          startBattle(enemy);
          break;
        }
      }
    }

    function updateInfoUI() {
      document.getElementById("info-name").innerText = playerName;
      document.getElementById("info-level").innerText = playerLv;
      document.getElementById("info-hp").innerText = heroHp;
      document.getElementById("info-max-hp").innerText = playerMaxHp;
      document.getElementById("info-dmg").innerText = touchDmgMult.toFixed(2);
      document.getElementById("info-exp").innerText = playerExp;
      document.getElementById("info-max-exp").innerText = playerMaxExp;
      document.getElementById("exp-fill").style.width = `${(playerExp / playerMaxExp) * 100}%`;
      
      document.getElementById("player-nametag").innerText = `${playerName} (Lv.${playerLv})`;
    }

    function gainExp(amount) {
      playerExp += amount;
      while (playerExp >= playerMaxExp) {
        playerExp -= playerMaxExp;
        playerLv++;
        
        touchDmgMult += 0.20;
        playerMaxHp += 25;
        heroHp = playerMaxHp;

        if (playerLv >= 3) {
          playerMaxExp += 50;
        }
        alert(`🎉 LEVEL UP! 레벨 ${playerLv} 달성!\n체력 +25 (최대 ${playerMaxHp}) | 터치당 데미지 +0.20 (총 ${touchDmgMult.toFixed(2)})`);
      }
      updateInfoUI();
    }

    // ================= [전투 시스템] =================
    let blobHp = 250.0;
    let blobMaxHp = 250.0;
    let stance = 'none';
    let isAttackingMode = false;
    let isDodgeMode = false;
    let touchCount = 0;
    let timer = null;
    let isCooltime = false;
    let dodgeDisabledTurn = false;

    function startBattle(enemy) {
      isFieldMode = false;
      currentEnemy = enemy;

      keys.w = keys.a = keys.s = keys.d = false;

      heroHp = playerMaxHp;
      blobHp = enemy.hp;
      blobMaxHp = enemy.hp;

      document.getElementById("battle-hero-name").innerText = playerName;
      document.getElementById("battle-hero-lv").innerText = playerLv;
      document.getElementById("blob-name").innerText = enemy.name;
      document.getElementById("hero-max-hp").innerText = playerMaxHp;
      document.getElementById("blob-max-hp").innerText = blobMaxHp;

      updateHpUI();

      document.getElementById("field-screen").style.display = "none";
      document.getElementById("battle-screen").style.display = "block";

      document.getElementById("msg-box").innerText = `⚔️ ${enemy.name}과의 전투 시작! 당신의 턴입니다.`;
      disableButtons(false);
    }

    function exitBattle(isVictory) {
      isAttackingMode = false;
      isDodgeMode = false;
      isCooltime = false;
      if (timer) clearInterval(timer);

      document.getElementById("battle-screen").style.display = "none";
      document.getElementById("field-screen").style.display = "block";

      isFieldMode = true;
      repositionEnemies();

      if (isVictory && currentEnemy) {
        gainExp(currentEnemy.exp);
      }
      updateInfoUI();
    }

    function handleRun(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      if (isCooltime) return;
      alert("🏃 전투에서 후퇴했습니다!");
      exitBattle(false);
    }

    function updateTouchBox() {
      const box = document.getElementById("touch-box");
      const text = document.getElementById("touch-count-text");
      text.innerText = touchCount;

      box.classList.remove("tier-yellow", "tier-orange", "tier-red", "tier-white");

      if (touchCount >= 130) box.classList.add("tier-white");
      else if (touchCount >= 100) box.classList.add("tier-red");
      else if (touchCount >= 60) box.classList.add("tier-orange");
      else if (touchCount >= 30) box.classList.add("tier-yellow");
    }

    function registerInput() {
      if (isAttackingMode) {
        touchCount++;
        updateTouchBox();
        let critRate = (touchCount * 0.3).toFixed(1);
        document.getElementById("msg-box").innerText = `🔥 연타! (${touchCount}회) | 크리티컬 확률: ${critRate}%`;
      } else if (isDodgeMode) {
        touchCount++;
        updateTouchBox();
        let dodgeRate = Math.min(100, Math.floor(touchCount / 10) * 5);
        document.getElementById("msg-box").innerText = `💨 회피 연타! (${touchCount}회) | 회피 성공률: ${dodgeRate}%`;
      }
    }

    // 화면 클릭/터치 시 연타 등록
    window.addEventListener("pointerdown", (e) => {
      if (!isFieldMode && document.getElementById("battle-screen").style.display === "block") {
        registerInput();
      }
    });

    function handleAttack(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      if (!isAttackingMode && !isCooltime) {
        isAttackingMode = true;
        touchCount = 0;
        updateTouchBox();
        disableButtons(true);
        
        let timeLeft = 5;
        document.getElementById("msg-box").innerText = `🔥 5초간 아무 키나 마구 누르세요!`;
        
        timer = setInterval(() => {
          timeLeft--;
          if (timeLeft <= 0) {
            clearInterval(timer);
            finishPlayerAttack();
          }
        }, 1000);
      }
    }

    function finishPlayerAttack() {
      isAttackingMode = false;
      let baseDamage = touchCount * touchDmgMult;
      let critRate = (touchCount * 0.3) / 100;
      let isCrit = Math.random() < critRate;

      let finalDamage = isCrit ? baseDamage * 2 : baseDamage;
      finalDamage = parseFloat(finalDamage.toFixed(1));

      blobHp = Math.max(0, blobHp - finalDamage).toFixed(1);

      triggerSlashEffect();

      setTimeout(() => {
        if (isCrit) triggerCritGlow();
        triggerShake();
        showFloatingText(finalDamage, 'blob', isCrit);
        updateHpUI();

        let critMsg = isCrit ? " 💥 [CRITICAL HIT! 2배]" : "";
        document.getElementById("msg-box").innerText = `⚔️ ${touchCount}회 연타! ${finalDamage} 데미지!${critMsg}`;

        if (blobHp <= 0) {
          setTimeout(() => { 
            alert(`🎉 ${currentEnemy.name} 처치 성공! (+${currentEnemy.exp} EXP)`); 
            exitBattle(true); 
          }, 500);
        } else {
          setTimeout(enemyTurn, 1500);
        }
      }, 150);
    }

    function handleCounter(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      if (isCooltime) return;
      stance = 'counter';
      document.getElementById("msg-box").innerText = "⚡ 반격 태세를 취했습니다!";
      disableButtons(true);
      setTimeout(enemyTurn, 1500);
    }

    function handleDodge(e) {
      if (e && e.stopPropagation) e.stopPropagation();
      if (!isDodgeMode && !isCooltime && !dodgeDisabledTurn) {
        isDodgeMode = true;
        touchCount = 0;
        updateTouchBox();
        disableButtons(true);
        
        let timeLeft = 5;
        document.getElementById("msg-box").innerText = `💨 5초간 아무 키나 누르면 회피 확률이 올라갑니다!`;
        
        timer = setInterval(() => {
          timeLeft--;
          if (timeLeft <= 0) {
            clearInterval(timer);
            finishDodgeSetup();
          }
        }, 1000);
      }
    }

    function finishDodgeSetup() {
      isDodgeMode = false;
      stance = 'dodge';
      let dodgeRate = Math.min(100, Math.floor(touchCount / 10) * 5);
      document.getElementById("msg-box").innerText = `💨 회피 준비 완료! (회피 확률: ${dodgeRate}%)`;
      setTimeout(enemyTurn, 1500);
    }

    function enemyTurn() {
      if (blobHp <= 0) return;

      let enemyDmg = Math.floor(Math.random() * (currentEnemy.maxDmg - currentEnemy.minDmg + 1)) + currentEnemy.minDmg;

      if (stance === 'counter') {
        let reflectDmg = parseFloat((enemyDmg * 1.5).toFixed(1));
        blobHp = Math.max(0, blobHp - reflectDmg).toFixed(1);
        
        triggerShake();
        showFloatingText(reflectDmg, 'blob', true);
        updateHpUI();

        document.getElementById("msg-box").innerText = `⚡ 반격 성공! 적의 공격을 반사하여 ${reflectDmg} 데미지를 주었습니다!`;
        stance = 'none';

        if (blobHp <= 0) {
          setTimeout(() => {
            alert(`🎉 ${currentEnemy.name} 처치 성공! (+${currentEnemy.exp} EXP)`);
            exitBattle(true);
          }, 500);
          return;
        }
      } else if (stance === 'dodge') {
        let dodgeRate = Math.min(100, Math.floor(touchCount / 10) * 5);
        let success = (Math.random() * 100) < dodgeRate;

        if (success) {
          document.getElementById("msg-box").innerText = `💨 적의 공격을 완벽하게 회피했습니다!`;
        } else {
          heroHp = Math.max(0, heroHp - enemyDmg).toFixed(1);
          triggerShake();
          showFloatingText(enemyDmg, 'hero', false);
          updateHpUI();
          document.getElementById("msg-box").innerText = `❌ 회피 실패! ${enemyDmg} 데미지를 입었습니다.`;
        }
        stance = 'none';
        dodgeDisabledTurn = true;
      } else {
        heroHp = Math.max(0, heroHp - enemyDmg).toFixed(1);
        triggerShake();
        showFloatingText(enemyDmg, 'hero', false);
        updateHpUI();
        document.getElementById("msg-box").innerText = `👾 적의 공격! ${enemyDmg} 데미지를 입었습니다.`;
      }

      if (heroHp <= 0) {
        setTimeout(() => {
          alert("💀 패배했습니다... 필드로 돌아갑니다.");
          exitBattle(false);
        }, 500);
      } else {
        setTimeout(startPlayerTurn, 1500);
      }
    }

    function startPlayerTurn() {
      if (dodgeDisabledTurn && stance === 'none') {
        dodgeDisabledTurn = false;
      }
      touchCount = 0;
      updateTouchBox();
      disableButtons(false);
      document.getElementById("msg-box").innerText = "당신의 턴입니다! [1]~[4] 키 또는 버튼을 누르세요.";
    }

    function disableButtons(disabled) {
      isCooltime = disabled;
      document.getElementById("btn-attack").disabled = disabled;
      document.getElementById("btn-counter").disabled = disabled;
      document.getElementById("btn-dodge").disabled = disabled || dodgeDisabledTurn;
      document.getElementById("btn-run").disabled = disabled;
    }

    function updateHpUI() {
      document.getElementById("hero-hp").innerText = heroHp;
      document.getElementById("blob-hp").innerText = blobHp;

      let heroHpPercent = Math.max(0, (heroHp / playerMaxHp) * 100);
      let blobHpPercent = Math.max(0, (blobHp / blobMaxHp) * 100);

      document.getElementById("hero-hp-fill").style.width = `${heroHpPercent}%`;
      document.getElementById("blob-hp-fill").style.width = `${blobHpPercent}%`;
    }

    function triggerShake() {
      const board = document.getElementById("game-board");
      board.classList.remove("shake");
      void board.offsetWidth;
      board.classList.add("shake");
    }

    function triggerCritGlow() {
      const board = document.getElementById("game-board");
      board.classList.remove("crit-glow");
      void board.offsetWidth;
      board.classList.add("crit-glow");
      setTimeout(() => board.classList.remove("crit-glow"), 500);
    }

    function triggerSlashEffect() {
      const effect = document.getElementById("slash-effect");
      effect.style.display = "block";
      effect.classList.remove("slash-active");
      void effect.offsetWidth;
      effect.classList.add("slash-active");
      setTimeout(() => { effect.style.display = "none"; }, 300);
    }

    function showFloatingText(amount, targetId, isCrit) {
      const target = document.getElementById(targetId);
      const floatEl = document.createElement("div");
      floatEl.className = "floating-damage" + (isCrit ? " crit" : "");
      floatEl.innerText = isCrit ? `CRITICAL!\n-${amount}` : `-${amount}`;

      const rect = target.getBoundingClientRect();
      const boardRect = document.getElementById("game-board").getBoundingClientRect();

      floatEl.style.left = (rect.left - boardRect.left + rect.width / 2 - 30) + "px";
      floatEl.style.top = (rect.top - boardRect.top) + "px";

      document.getElementById("game-board").appendChild(floatEl);

      setTimeout(() => floatEl.remove(), 800);
    }
  </script>
</body>
</html>
