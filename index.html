<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>턴제 RPG 미니게임</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      text-align: center;
      background-color: #121212;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      width: 100%;
      max-width: 1150px;
      padding: 10px;
      margin: 0 auto;
    }

    /* ================= 1. 타이틀 화면 ================= */
    #title-screen {
      width: 100%;
      height: 600px;
      border: 3px solid #fff;
      background-color: #1e1e1e;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 30px;
    }

    .title-a {
      width: 100%;
      padding: 25px;
      border: 3px solid #fff;
      background: #111;
      font-size: 32px;
      font-weight: bold;
      color: #4facfe;
      border-radius: 12px;
    }

    .title-b {
      width: 100%;
      padding: 20px;
      border: 2px dashed #777;
      background: rgba(0, 0, 0, 0.5);
      font-size: 20px;
      color: #ffff00;
      border-radius: 10px;
      animation: blink 1.2s infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* ================= 2. 로그인 화면 ================= */
    #auth-screen {
      width: 100%;
      height: 600px;
      border: 3px solid #fff;
      background-color: #1e1e1e;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .auth-box {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth-input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      background: #000;
      color: #00ff88;
      border: 2px solid #777;
      border-radius: 8px;
      text-align: center;
    }

    .auth-btn-group { display: flex; gap: 10px; }

    .auth-btn {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      background: #333;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 8px;
      cursor: pointer;
    }

    /* ================= 3. 필드 화면 & 카메라 ================= */
    #field-screen {
      width: 100%;
      height: 650px;
      border: 3px solid #fff;
      background-color: #1e1e1e;
      position: relative;
      overflow: hidden;
      display: none;
    }

    /* 뷰포트 & 카메라 맵 */
    #viewport {
      width: 100%;
      height: 480px;
      position: relative;
      overflow: hidden;
      background: #0d0d0d;
    }

    #world-map {
      width: 1600px;
      height: 1000px;
      position: absolute;
      top: 0; left: 0;
      background: #1a1a1a;
    }

    /* 구역 구분 (A: 상/하단 적구역, B: 중앙 통로) */
    .zone-a {
      position: absolute;
      width: 100%;
      background: rgba(255, 0, 0, 0.05);
      border-bottom: 2px dashed #ff4444;
    }
    .zone-a.bottom { border-bottom: none; border-top: 2px dashed #ff4444; }

    .zone-b {
      position: absolute;
      top: 380px;
      height: 240px;
      width: 100%;
      background: rgba(0, 255, 136, 0.03);
    }

    /* 포탈 (C, D) */
    .portal {
      position: absolute;
      top: 450px;
      width: 70px;
      height: 100px;
      border: 3px solid;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      animation: pulse 1.5s infinite alternate;
    }
    .portal-c { right: 40px; border-color: #00ff88; color: #00ff88; box-shadow: 0 0 15px #00ff88; }
    .portal-d { left: 40px; border-color: #ffea00; color: #ffea00; box-shadow: 0 0 15px #ffea00; }

    @keyframes pulse { from { transform: scale(0.95); } to { transform: scale(1.05); } }

    /* 플레이어 & 적 */
    #player-node {
      position: absolute;
      width: 32px;
      height: 32px;
      background: #4facfe;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px #4facfe;
      z-index: 5;
    }

    .enemy-dot {
      position: absolute;
      width: 28px;
      height: 28px;
      background: #ff4444;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff4444;
      z-index: 4;
    }

    /* ================= 하단 UI & 상단 메인 팝업 ================= */
    #field-bottom-ui {
      height: 170px;
      background: #111;
      border-top: 3px solid #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      gap: 15px;
    }

    #dpad {
      width: 120px;
      height: 120px;
      position: relative;
      flex-shrink: 0;
    }
    .pad-btn {
      position: absolute;
      width: 38px;
      height: 38px;
      background: #333;
      color: #fff;
      border: 2px solid #777;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    #btn-w { top: 0; left: 41px; }
    #btn-a { top: 41px; left: 0; }
    #btn-s { top: 82px; left: 41px; }
    #btn-d { top: 41px; left: 82px; }

    .ui-tab-buttons {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tab-btn {
      padding: 8px 16px;
      background: #222;
      color: #fff;
      border: 2px solid #555;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .tab-btn:hover, .tab-btn.active { border-color: #00ff88; color: #00ff88; }

    /* 상단 메인 팝업 모달 */
    #main-popup {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      max-width: 90%;
      background: rgba(0, 0, 0, 0.95);
      border: 3px solid #fff;
      border-radius: 12px;
      padding: 15px;
      z-index: 20;
      display: none;
    }
    .popup-header {
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid #555;
      padding-bottom: 8px;
      margin-bottom: 10px;
      color: #4facfe;
    }
    .popup-close {
      position: absolute;
      top: 10px; right: 15px;
      cursor: pointer;
      color: #ff4444;
      font-weight: bold;
      font-size: 18px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0;
      padding: 4px 8px;
      background: #222;
      border-radius: 6px;
    }

    .stat-btn {
      padding: 2px 10px;
      background: #00ff88;
      color: #000;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    /* ================= 4. 전투 화면 ================= */
    #battle-screen { display: none; width: 100%; }
    #game-board {
      width: 100%; height: 480px;
      border: 3px solid #fff;
      background: #000;
      position: relative;
      border-radius: 10px;
    }
    .status-bar { position: absolute; top: 15px; font-weight: bold; font-size: 15px; }
    #hero-status { left: 15px; color: #4facfe; text-align: left; }
    #blob-status { right: 15px; text-align: right; color: #ff0844; }
    .character { position: absolute; top: 180px; font-size: 80px; }
    #hero { left: 10%; } #blob { right: 10%; }
    #touch-box {
      position: absolute; top: 180px; left: 50%; transform: translateX(-50%);
      width: 160px; height: 110px; background: #1a1a1a; border: 3px solid #555;
      border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer;
    }
    #touch-box:active { background: #333; transform: translateX(-50%) scale(0.98); }
    #ui-container { display: flex; gap: 10px; margin-top: 10px; }
    .btn { flex: 1; padding: 18px 0; font-size: 16px; font-weight: bold; border: 2px solid #fff; background: #000; color: #fff; border-radius: 8px; cursor: pointer; }
    .btn:hover { background: #222; }
  </style>
</head>
<body>

  <div id="game-container">

    <!-- 1. 타이틀 화면 -->
    <div id="title-screen" onclick="goToAuthScreen()">
      <div class="title-a">턴제 RPG 게임</div>
      <div class="title-b">화면을 클릭하여 시작하세요</div>
    </div>

    <!-- 2. 로그인 화면 -->
    <div id="auth-screen">
      <div style="font-size:22px; font-weight:bold;">로그인 / 회원가입</div>
      <div class="auth-box">
        <input type="text" id="auth-username" class="auth-input" placeholder="아이디 (닉네임)" maxlength="8">
        <input type="password" id="auth-password" class="auth-input" placeholder="비밀번호" maxlength="16">
        <div class="auth-btn-group">
          <button class="auth-btn" onclick="handleLogin()">로그인</button>
          <button class="auth-btn" style="border-color:#4facfe; color:#4facfe;" onclick="handleSignUp()">회원가입</button>
        </div>
      </div>
    </div>

    <!-- 3. 필드 화면 -->
    <div id="field-screen">
      <!-- 상단 메인 팝업 -->
      <div id="main-popup">
        <div class="popup-close" onclick="closePopup()">✖</div>
        <div id="popup-title" class="popup-header">스탯 정보</div>
        <div id="popup-content"></div>
      </div>

      <!-- 카메라 뷰포트 -->
      <div id="viewport">
        <div id="world-map">
          <!-- A 영역 (상단 적 구역) -->
          <div class="zone-a" style="top: 0; height: 380px;"></div>
          <!-- B 영역 (중앙 통로) -->
          <div class="zone-b"></div>
          <!-- A 영역 (하단 적 구역) -->
          <div class="zone-a bottom" style="top: 620px; height: 380px;"></div>

          <!-- C / D 포탈 -->
          <div id="portal-d" class="portal portal-d">D</div>
          <div id="portal-c" class="portal portal-c">C</div>

          <!-- 플레이어 -->
          <div id="player-node"></div>
        </div>
      </div>

      <!-- 하단 UI 바 -->
      <div id="field-bottom-ui">
        <div id="dpad">
          <button id="btn-w" class="pad-btn">W</button>
          <button id="btn-a" class="pad-btn">A</button>
          <button id="btn-s" class="pad-btn">S</button>
          <button id="btn-d" class="pad-btn">D</button>
        </div>

        <div style="text-align:left; line-height: 1.6;">
          <div><b>플레이어:</b> <span id="ui-name">-</span> (Lv.<span id="ui-lv">1</span>)</div>
          <div><b>현재 맵:</b> <span id="ui-map-name" style="color:#00ff88;">쉬움</span></div>
          <div><b>스탯 포인트:</b> <span id="ui-stat-pts" style="color:#ffff00;">0</span></div>
        </div>

        <div class="ui-tab-buttons">
          <button class="tab-btn" onclick="openPopup('stat')">스탯</button>
          <button class="tab-btn" onclick="openPopup('skill')">스킬</button>
          <button class="tab-btn" onclick="openPopup('mutation')">변이</button>
          <button class="tab-btn" onclick="openPopup('info')">정보</button>
        </div>
      </div>
    </div>

    <!-- 4. 전투 화면 -->
    <div id="battle-screen">
      <div id="game-board">
        <div id="hero-status" class="status-bar">
          <span id="battle-hero-name">-</span> (Lv.<span id="battle-hero-lv">1</span>)<br>
          HP: <span id="hero-hp">100</span>/<span id="hero-max-hp">100</span>
        </div>
        <div id="blob-status" class="status-bar">
          <span id="blob-name">적</span> (Lv.<span id="blob-lv">1</span>)<br>
          HP: <span id="blob-hp">100</span>/<span id="blob-max-hp">100</span>
        </div>
        <div id="hero" class="character">⚔️</div>

        <!-- 터치 타격 영역 -->
        <div id="touch-box" onclick="handleAttack(event)">
          <div style="font-size:11px; color:#aaa;">TAP HERE TO ATTACK</div>
          <div id="touch-count-text" style="font-size:32px; font-weight:bold; color:#00ff88;">0</div>
        </div>

        <div id="blob" class="character">👾</div>
      </div>

      <div id="msg-box" style="margin:10px 0; font-weight:bold; color:#ffff00;">전투 시작! 연타하여 공격하세요!</div>

      <div id="ui-container">
        <button id="btn-attack" class="btn" onclick="handleAttack(event)">⚔️ 공격</button>
        <button id="btn-run" class="btn" style="border-color:#ff8800; color:#ff8800;" onclick="handleRun(event)">🏃 후퇴</button>
      </div>
    </div>

  </div>

  <script>
    // ================= [게임 기본 상태 변수] =================
    let playerName = "";
    let playerLv = 1;
    let playerExp = 0;
    let playerMaxExp = 100;
    let statPoints = 0;

    // 플레이어 능력치
    let bonusAtk = 0;
    let bonusHp = 0;
    let bonusDodge = 0;

    let baseHp = 100;
    let playerMaxHp = 100;
    let heroHp = 100;
    let touchDmgMult = 10;

    // 맵 정의
    const MAPS = [
      { id: 0, name: "쉬움", minLv: 3, maxLv: 10, reqLv: 1 },
      { id: 1, name: "보통", minLv: 11, maxLv: 18, reqLv: 1 },
      { id: 2, name: "어려움", minLv: 19, maxLv: 25, reqLv: 1 },
      { id: 3, name: "도전", minLv: 26, maxLv: 35, reqLv: 1 },
      { id: 4, name: "최종", minLv: 40, maxLv: 60, reqLv: 40 }
    ];
    let currentMapIdx = 0;

    // ================= [세이브 / 로드] =================
    function getUsersData() {
      const data = localStorage.getItem("game_users");
      return data ? JSON.parse(data) : {};
    }

    function saveUsersData(users) {
      localStorage.setItem("game_users", JSON.stringify(users));
    }

    function autoSave() {
      if (!playerName) return;
      const users = getUsersData();
      if (users[playerName]) {
        users[playerName].saveData = {
          playerLv, playerExp, playerMaxExp, statPoints,
          bonusAtk, bonusHp, bonusDodge, currentMapIdx
        };
        saveUsersData(users);
      }
    }

    function goToAuthScreen() {
      document.getElementById("title-screen").style.display = "none";
      document.getElementById("auth-screen").style.display = "flex";
    }

    function handleSignUp() {
      const u = document.getElementById("auth-username").value.trim();
      const p = document.getElementById("auth-password").value.trim();
      if (!u || !p) return alert("아이디와 비밀번호를 입력하세요.");

      const users = getUsersData();
      if (users[u]) return alert("이미 존재하는 아이디입니다.");

      users[u] = { password: p, saveData: null };
      saveUsersData(users);
      alert("회원가입 완료!");
      loginSuccess(u, null);
    }

    function handleLogin() {
      const u = document.getElementById("auth-username").value.trim();
      const p = document.getElementById("auth-password").value.trim();
      const users = getUsersData();

      if (!users[u] || users[u].password !== p) return alert("정보가 일치하지 않습니다.");
      loginSuccess(u, users[u].saveData);
    }

    function loginSuccess(u, saveData) {
      playerName = u;
      if (saveData) {
        playerLv = saveData.playerLv || 1;
        playerExp = saveData.playerExp || 0;
        playerMaxExp = saveData.playerMaxExp || 100;
        statPoints = saveData.statPoints || 0;
        bonusAtk = saveData.bonusAtk || 0;
        bonusHp = saveData.bonusHp || 0;
        bonusDodge = saveData.bonusDodge || 0;
        currentMapIdx = saveData.currentMapIdx || 0;
      }
      recalcStats();

      document.getElementById("auth-screen").style.display = "none";
      document.getElementById("field-screen").style.display = "block";
      initMap();
    }

    function recalcStats() {
      playerMaxHp = baseHp + (playerLv - 1) * 20 + bonusHp * 15;
      heroHp = playerMaxHp;
      touchDmgMult = 10 + (bonusAtk * 5); // 기본 데미지 10 + 포인트당 5 증가
    }

    // ================= [카메라 & 필드 시스템] =================
    let playerX = 800, playerY = 500;
    let enemies = [];
    let isFieldActive = false;
    const keys = { w: false, a: false, s: false, d: false };

    function initMap() {
      isFieldActive = true;
      document.getElementById("ui-name").innerText = playerName;
      document.getElementById("ui-lv").innerText = playerLv;
      document.getElementById("ui-map-name").innerText = MAPS[currentMapIdx].name;
      document.getElementById("ui-stat-pts").innerText = statPoints;

      // 포탈 표시 세팅
      const pC = document.getElementById("portal-c");
      const pD = document.getElementById("portal-d");

      pC.style.display = (currentMapIdx < 4) ? "flex" : "none"; // 최종은 C 없음
      pD.style.display = (currentMapIdx > 0) ? "flex" : "none"; // 쉬움은 D 없음

      // 적 생성 (A 영역에만 8마리)
      spawnEnemies();
      requestAnimationFrame(fieldGameLoop);
    }

    function spawnEnemies() {
      document.querySelectorAll(".enemy-dot").forEach(e => e.remove());
      enemies = [];
      const mapInfo = MAPS[currentMapIdx];

      for (let i = 0; i < 8; i++) {
        const isTop = Math.random() < 0.5;
        const enemyY = isTop ? Math.random() * 320 + 30 : Math.random() * 320 + 630; // A 영역 한정
        const enemyX = Math.random() * 1400 + 100;
        const enemyLv = Math.floor(Math.random() * (mapInfo.maxLv - mapInfo.minLv + 1)) + mapInfo.minLv;

        const el = document.createElement("div");
        el.className = "enemy-dot";
        document.getElementById("world-map").appendChild(el);

        enemies.push({ x: enemyX, y: enemyY, lv: enemyLv, isTop, el, vx: Math.random() < 0.5 ? 1 : -1 });
      }
    }

    function fieldGameLoop() {
      if (!isFieldActive) return;

      // 플레이어 이동
      const speed = 5;
      if (keys.w) playerY = Math.max(30, playerY - speed);
      if (keys.s) playerY = Math.min(950, playerY + speed);
      if (keys.a) playerX = Math.max(30, playerX - speed);
      if (keys.d) playerX = Math.min(1550, playerX + speed);

      // 플레이어 노드 위치
      const pNode = document.getElementById("player-node");
      pNode.style.left = playerX + "px";
      pNode.style.top = playerY + "px";

      // 카메라 추적
      const viewport = document.getElementById("viewport");
      const camX = Math.max(0, Math.min(1600 - viewport.clientWidth, playerX - viewport.clientWidth / 2));
      const camY = Math.max(0, Math.min(1000 - viewport.clientHeight, playerY - viewport.clientHeight / 2));
      document.getElementById("world-map").style.transform = `translate(${-camX}px, ${-camY}px)`;

      // 적 이동 (A 영역 고정)
      enemies.forEach(e => {
        e.x += e.vx * 1.5;
        if (e.x < 50 || e.x > 1500) e.vx *= -1;

        e.el.style.left = e.x + "px";
        e.el.style.top = e.y + "px";

        // 충돌 체크
        const dist = Math.hypot(playerX - e.x, playerY - e.y);
        if (dist < 30) startBattle(e);
      });

      // 포탈 충돌 체크 (C: 다음, D: 이전)
      if (currentMapIdx < 4 && playerX > 1480 && playerY > 430 && playerY < 550) {
        changeMap(currentMapIdx + 1);
      } else if (currentMapIdx > 0 && playerX < 100 && playerY > 430 && playerY < 550) {
        changeMap(currentMapIdx - 1);
      }

      requestAnimationFrame(fieldGameLoop);
    }

    function changeMap(targetIdx) {
      const targetMap = MAPS[targetIdx];
      if (playerLv < targetMap.reqLv) {
        alert(`❌ [${targetMap.name}] 맵은 레벨 ${targetMap.reqLv} 이상부터 입장 가능합니다!`);
        playerX = 800; playerY = 500;
        return;
      }

      currentMapIdx = targetIdx;
      playerX = 800; playerY = 500;
      autoSave();
      initMap();
    }

    // 방향키 이벤트
    window.addEventListener("keydown", e => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'ㅈ') keys.w = true;
      if (k === 'a' || k === 'ㅁ') keys.a = true;
      if (k === 's' || k === 'ㄴ') keys.s = true;
      if (k === 'd' || k === 'ㅇ') keys.d = true;
    });
    window.addEventListener("keyup", e => {
      const k = e.key.toLowerCase();
      if (k === 'w' || k === 'ㅈ') keys.w = false;
      if (k === 'a' || k === 'ㅁ') keys.a = false;
      if (k === 's' || k === 'ㄴ') keys.s = false;
      if (k === 'd' || k === 'ㅇ') keys.d = false;
    });

    // ================= [상단 팝업 시스템] =================
    function openPopup(type) {
      const popup = document.getElementById("main-popup");
      const title = document.getElementById("popup-title");
      const content = document.getElementById("popup-content");

      popup.style.display = "block";

      if (type === 'stat') {
        title.innerText = "📊 스탯 관리";
        content.innerHTML = `
          <div style="text-align:left; line-height: 1.8;">
            <div style="color:#ffff00; font-weight:bold; margin-bottom:10px;">사용 가능한 스탯 포인트: ${statPoints}</div>
            <div class="stat-row">
              <span>⚔️ 공격력 (+${bonusAtk * 5})</span>
              <button class="stat-btn" onclick="addStat('atk')">+1</button>
            </div>
            <div class="stat-row">
              <span>❤️ 최대 체력 (+${bonusHp * 15})</span>
              <button class="stat-btn" onclick="addStat('hp')">+1</button>
            </div>
            <div class="stat-row">
              <span>💨 회피율 (+${bonusDodge}%)</span>
              <button class="stat-btn" onclick="addStat('dodge')">+1</button>
            </div>
          </div>
        `;
      } else if (type === 'skill') {
        title.innerText = "🔮 스킬 정보";
        content.innerHTML = `<div style="padding: 20px 0;">추후 다양한 전투 스킬이 추가될 예정입니다.</div>`;
      } else if (type === 'mutation') {
        title.innerText = "🧬 변이 시스템";
        if (playerLv < 15) {
          content.innerHTML = `<div style="color:#ff4444; padding: 20px 0;">🔒 [변이] 기능은 레벨 15에 해금됩니다!<br>(현재 레벨: Lv.${playerLv})</div>`;
        } else {
          content.innerHTML = `<div style="color:#00ff88; padding: 20px 0;">🧪 변이 시스템이 해금되었습니다. (추후 구현 예정)</div>`;
        }
      } else if (type === 'info') {
        title.innerText = "ℹ️ 유저 정보";
        content.innerHTML = `
          <div style="text-align:left; line-height: 1.8; padding: 10px;">
            <div><b>플레이어 닉네임:</b> ${playerName}</div>
            <div><b>레벨:</b> Lv.${playerLv} / 50 (최대)</div>
            <div><b>경험치:</b> ${playerExp} / ${playerMaxExp}</div>
            <div><b>현재 위치:</b> ${MAPS[currentMapIdx].name} 맵</div>
          </div>
        `;
      }
    }

    function closePopup() { document.getElementById("main-popup").style.display = "none"; }

    function addStat(statType) {
      if (statPoints <= 0) return alert("스탯 포인트가 부족합니다!");
      statPoints--;
      if (statType === 'atk') bonusAtk++;
      if (statType === 'hp') bonusHp++;
      if (statType === 'dodge') bonusDodge++;

      recalcStats();
      autoSave();
      openPopup('stat');
      document.getElementById("ui-stat-pts").innerText = statPoints;
    }

    // ================= [전투 시스템] =================
    let currentEnemy = null;
    let battleBlobHp = 100, battleBlobMaxHp = 100;
    let battleTouchCount = 0;

    function startBattle(enemy) {
      isFieldActive = false;
      currentEnemy = enemy;
      battleTouchCount = 0;

      battleBlobMaxHp = enemy.lv * 25;
      battleBlobHp = battleBlobMaxHp;

      document.getElementById("battle-hero-name").innerText = playerName;
      document.getElementById("battle-hero-lv").innerText = playerLv;
      document.getElementById("blob-lv").innerText = enemy.lv;
      document.getElementById("hero-hp").innerText = heroHp;
      document.getElementById("hero-max-hp").innerText = playerMaxHp;
      document.getElementById("blob-hp").innerText = battleBlobHp;
      document.getElementById("blob-max-hp").innerText = battleBlobMaxHp;
      document.getElementById("touch-count-text").innerText = "0";

      document.getElementById("field-screen").style.display = "none";
      document.getElementById("battle-screen").style.display = "block";
    }

    function handleAttack(e) {
      if (e) e.stopPropagation();
      battleTouchCount++;
      document.getElementById("touch-count-text").innerText = battleTouchCount;

      let dmg = touchDmgMult;
      battleBlobHp = Math.max(0, battleBlobHp - dmg);
      document.getElementById("blob-hp").innerText = Math.ceil(battleBlobHp);

      if (battleBlobHp <= 0) {
        alert("🎉 승리했습니다!");
        gainExp(currentEnemy.lv * 20);
        endBattle();
      }
    }

    function handleRun(e) {
      if (e) e.stopPropagation();
      alert("🏃 도망쳤습니다!");
      endBattle();
    }

    function endBattle() {
      document.getElementById("battle-screen").style.display = "none";
      document.getElementById("field-screen").style.display = "block";
      playerX = 800; playerY = 500;
      initMap();
    }

    function gainExp(exp) {
      if (playerLv >= 50) return; // 최대 레벨 50
      playerExp += exp;
      while (playerExp >= playerMaxExp && playerLv < 50) {
        playerExp -= playerMaxExp;
        playerLv++;
        statPoints += 2; // 레벨업 시 스탯포인트 +2
        playerMaxExp += 40;
        alert(`🎉 레벨업! Lv.${playerLv} 달성! (스탯 포인트 +2)`);
      }
      recalcStats();
      autoSave();
    }
  </script>
</body>
</html>
